# Kitty Terminal 完整配置
# 基于 iTerm2 主题配色

# ===== 字体设置 =====
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 16.0

# ===== 光标设置 =====
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor #00ff00

# ===== 滚动设置 =====
scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# ===== 鼠标设置 =====
mouse_hide_wait 3.0
url_color #0087bd
url_style curly
open_url_with default
copy_on_select no

# ===== 窗口设置 =====
remember_window_size  yes
initial_window_width  1400
initial_window_height 900
window_padding_width 8
window_padding_height 8
window_border_width 0.5pt
draw_minimal_borders yes
window_margin_width 0
single_window_margin_width -1
placement_strategy center

# ===== 标签页设置 =====
tab_bar_edge top
tab_bar_margin_width 0.0
tab_bar_style powerline
# tab_powerline_style slanted
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_fade 0.25 0.5 0.75 1
tab_title_template "{index}: {title}"
active_tab_foreground   #000
active_tab_background   #8ae234
active_tab_font_style   bold
inactive_tab_foreground #d0d0d0
inactive_tab_background #2e3436
inactive_tab_font_style normal

# ===== 配色方案 =====
# 基础颜色
foreground #fce94f
background #0a0a0a
background_opacity 0.95
dynamic_background_opacity no
selection_foreground #191919
selection_background #fce94f

# 黑色 (Black)
color0 #000000
color8 #808080

# 红色 (Red)
color1 #c00000
color9 #ff6060

# 绿色 (Green)
color2 #00c000
color10 #60ff60

# 黄色 (Yellow)
color3 #c0c000
color11 #ffff60

# 蓝色 (Blue)
color4 #6ab5f6
color12 #6060ff

# 洋红色 (Magenta)
color5 #c000c0
color13 #ff60ff

# 青色 (Cyan)
color6 #05e0e0
color14 #60ffff

# 白色 (White)
color7 #c0c0c0
color15 #ffffff

# ===== 高级设置 =====
shell .
editor .
close_on_child_death no
allow_remote_control yes
listen_on none
update_check_interval 24
startup_session none
clipboard_control write-clipboard write-primary

# ===== 终端铃声 =====
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab yes
command_on_bell none

# ===== 性能优化 =====
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ===== macOS 特定设置 =====
macos_titlebar_color background
macos_option_as_alt yes
macos_hide_from_tasks no
macos_quit_when_last_window_closed no
macos_window_resizable yes
macos_thicken_font 0.15
macos_traditional_fullscreen no
macos_show_window_title_in all
macos_custom_beam_cursor yes

# ===== 快捷键设置 =====
# 标签页管理
map cmd+t new_tab
map cmd+w close_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5

# 窗口管理
map cmd+n new_os_window
map cmd+shift+n new_os_window_with_cwd

# 字体大小
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0

# 复制粘贴
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# 其他
map cmd+k clear_terminal scrollback active
map cmd+f show_scrollback

# ===== 布局设置 =====
enabled_layouts *
window_resize_step_cells 2
window_resize_step_lines 2
confirm_os_window_close 0


